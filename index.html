<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS99 RAP • Inflated Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>PS99 <span class="accent">RAP TRACKER</span></h1>
    <p class="subtitle">Live Market • Inflated Detector • All Items</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="filterCategory('all')">All</button>
    <button class="tab-btn" onclick="filterCategory('Pet')">Pets</button>
    <button class="tab-btn" onclick="filterCategory('Enchant')">Enchants</button>
    <button class="tab-btn" onclick="filterCategory('Charm')">Charms</button>
    <button class="tab-btn" onclick="filterCategory('Egg')">Eggs</button>
    <button class="tab-btn" onclick="filterCategory('Item')">Items</button>
  </div>

  <div class="container">
    <p id="last-updated" class="updated"></p>
    <div id="loading">Loading market data...</div>
    <div id="results" class="results"></div>
  </div>

  <button onclick="fetchLiveRAP()" class="refresh-btn">🔄 Refresh Live Data</button>

  <script src="app.js"></script>
</body>
</html>
